<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Who Wants to Win a Million — German Traffic Code</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --asphalt: #17191c;
    --asphalt-2: #212429;
    --line-white: #f4f4f2;
    --autobahn-blue: #0a2f6b;
    --autobahn-blue-2: #123a82;
    --signal-yellow: #ffcf3f;
    --ampel-red: #d3352a;
    --ampel-green: #3fa66a;
    --muted: #9099a6;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      repeating-linear-gradient(0deg, transparent, transparent 78px, rgba(244,244,242,0.05) 78px, rgba(244,244,242,0.05) 82px),
      var(--asphalt);
    color:var(--line-white);
    font-family:'Barlow', sans-serif;
    min-height:100vh;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding:28px 16px 60px;
  }
  .stage{
    width:100%;
    max-width:980px;
    display:grid;
    grid-template-columns: 1fr 220px;
    gap:22px;
  }
  @media (max-width:760px){
    .stage{grid-template-columns:1fr;}
    .ladder{order:-1;}
  }

  /* ---- Header / sign bar ---- */
  .header{
    grid-column:1/-1;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    margin-bottom:4px;
  }
  .title-sign{
    background:var(--autobahn-blue);
    border:4px solid var(--line-white);
    border-radius:6px;
    padding:10px 20px;
    font-family:'Barlow Condensed', sans-serif;
    font-weight:800;
    letter-spacing:0.5px;
    text-transform:uppercase;
    font-size:22px;
    box-shadow:0 4px 0 rgba(0,0,0,0.35);
  }
  .title-sign span{
    display:block;
    font-size:11px;
    font-weight:600;
    letter-spacing:2px;
    color:var(--signal-yellow);
    text-transform:uppercase;
    margin-bottom:2px;
  }
  .total-badge{
    background:var(--signal-yellow);
    color:var(--asphalt);
    font-family:'Barlow Condensed', sans-serif;
    font-weight:800;
    font-size:26px;
    padding:8px 18px;
    border-radius:6px;
    border:3px solid #b8860b;
    min-width:120px;
    text-align:center;
    box-shadow:0 4px 0 rgba(0,0,0,0.35);
  }
  .total-badge small{
    display:block;
    font-family:'Barlow', sans-serif;
    font-weight:600;
    font-size:10px;
    letter-spacing:2px;
    text-transform:uppercase;
  }

  /* ---- Ladder ---- */
  .ladder{
    background:var(--asphalt-2);
    border-radius:10px;
    padding:14px 12px;
    display:flex;
    flex-direction:column-reverse;
    gap:6px;
    border:1px solid rgba(244,244,242,0.08);
    height:fit-content;
  }
  .ladder-title{
    order:1;
    text-align:center;
    font-family:'Barlow Condensed', sans-serif;
    text-transform:uppercase;
    letter-spacing:2px;
    font-size:12px;
    color:var(--muted);
    padding-bottom:6px;
    border-bottom:1px solid rgba(244,244,242,0.1);
    margin-bottom:4px;
  }
  .rung{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:6px 10px;
    border-radius:5px;
    font-family:'Barlow Condensed', sans-serif;
    font-weight:700;
    font-size:15px;
    color:var(--muted);
    transition:all .25s ease;
  }
  .rung .n{opacity:.7;font-size:12px;}
  .rung.done{color:var(--ampel-green);}
  .rung.current{
    background:var(--signal-yellow);
    color:var(--asphalt);
    transform:scale(1.04);
  }
  .rung.bonus-mark{color:var(--signal-yellow);}

  /* ---- Panel ---- */
  .panel{
    background:var(--asphalt-2);
    border-radius:12px;
    border:1px solid rgba(244,244,242,0.08);
    padding:26px;
    min-height:420px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    position:relative;
    overflow:hidden;
  }
  .panel::before{
    content:"";
    position:absolute;
    left:0;right:0;bottom:0;
    height:6px;
    background:repeating-linear-gradient(90deg, var(--line-white) 0 26px, transparent 26px 46px);
    opacity:.15;
  }

  /* Start screen */
  .screen{display:flex; flex-direction:column; align-items:center; text-align:center; gap:16px;}
  .screen h1{
    font-family:'Barlow Condensed', sans-serif;
    font-size:34px;
    font-weight:800;
    text-transform:uppercase;
    letter-spacing:1px;
    margin:0;
  }
  .screen p{color:var(--muted); max-width:520px; line-height:1.5; margin:0; font-size:15px;}
  .btn{
    font-family:'Barlow Condensed', sans-serif;
    font-weight:700;
    letter-spacing:1px;
    text-transform:uppercase;
    font-size:17px;
    border:none;
    border-radius:8px;
    padding:14px 30px;
    cursor:pointer;
    background:var(--signal-yellow);
    color:var(--asphalt);
    box-shadow:0 4px 0 #b8860b;
    transition:transform .12s ease;
  }
  .btn:hover{transform:translateY(-2px);}
  .btn:active{transform:translateY(1px); box-shadow:0 2px 0 #b8860b;}
  .btn.secondary{
    background:transparent;
    color:var(--line-white);
    border:2px solid rgba(244,244,242,0.3);
    box-shadow:none;
  }
  .badge-euro{
    font-family:'Barlow Condensed', sans-serif;
    font-size:52px;
    font-weight:800;
    color:var(--signal-yellow);
  }

  /* Question */
  .q-wrap{animation:fadeIn .35s ease;}
  @keyframes fadeIn{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}
  .q-eyebrow{
    font-family:'Barlow Condensed', sans-serif;
    text-transform:uppercase;
    letter-spacing:2px;
    font-size:12px;
    color:var(--signal-yellow);
    margin-bottom:10px;
  }
  .q-sign{
    background:var(--autobahn-blue);
    border:3px solid var(--line-white);
    border-radius:8px;
    padding:20px 22px;
    font-family:'Barlow Condensed', sans-serif;
    font-weight:700;
    font-size:22px;
    line-height:1.3;
    margin-bottom:20px;
    box-shadow:0 4px 0 rgba(0,0,0,0.3);
  }
  .options{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
  }
  .options.two{grid-template-columns:1fr 1fr;}
  .opt{
    display:flex;
    align-items:center;
    gap:10px;
    background:var(--asphalt);
    border:2px solid rgba(244,244,242,0.15);
    border-radius:8px;
    padding:13px 16px;
    font-size:15px;
    font-weight:500;
    color:var(--line-white);
    cursor:pointer;
    text-align:left;
    transition:all .15s ease;
  }
  .opt:hover:not(:disabled){border-color:var(--signal-yellow); background:#26292f;}
  .opt .letter{
    font-family:'Barlow Condensed', sans-serif;
    font-weight:800;
    background:var(--signal-yellow);
    color:var(--asphalt);
    width:26px; height:26px;
    border-radius:5px;
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
    font-size:14px;
  }
  .opt.correct{border-color:var(--ampel-green); background:rgba(63,166,106,0.18);}
  .opt.wrong{border-color:var(--ampel-red); background:rgba(211,53,42,0.2);}
  .opt:disabled{cursor:default;}

  .feedback{
    margin-top:16px;
    font-size:14px;
    color:var(--muted);
    min-height:20px;
  }
  .footer-row{
    margin-top:22px;
    display:flex;
    justify-content:flex-end;
  }

  .pill{
    display:inline-block;
    font-family:'Barlow Condensed', sans-serif;
    letter-spacing:1.5px;
    text-transform:uppercase;
    font-size:11px;
    background:rgba(255,207,63,0.15);
    color:var(--signal-yellow);
    padding:4px 10px;
    border-radius:20px;
    border:1px solid rgba(255,207,63,0.4);
    margin-bottom:8px;
  }
</style>
</head>
<body>
<div class="stage">
  <div class="header">
    <div class="title-sign"><span>Exam · Road Traffic</span>Who Wants to Win a Million?</div>
    <div class="total-badge" id="totalBadge"><small>Prize Pool</small>€0</div>
  </div>

  <div class="panel" id="panel"></div>

  <div class="ladder" id="ladder">
    <div class="ladder-title">Levels</div>
  </div>
</div>

<script>
const MAIN_QUESTIONS = [
  {
    q: "What is the maximum speed limit within built-up areas in Germany, in the absence of a sign?",
    options: ["30 km/h", "50 km/h", "60 km/h", "70 km/h"],
    correct: 1
  },
  {
    q: "Outside built-up areas, on a normal road without a speed limit sign, what is the maximum speed?",
    options: ["80 km/h", "90 km/h", "100 km/h", "120 km/h"],
    correct: 2
  },
  {
    q: "On a German motorway with no posted speed limit, what is the recommended speed (Richtgeschwindigkeit)?",
    options: ["110 km/h", "120 km/h", "130 km/h", "150 km/h"],
    correct: 2
  },
  {
    q: "What is the maximum blood alcohol level allowed for an experienced driver over 21?",
    options: ["0.0 ‰", "0.3 ‰", "0.5 ‰", "0.8 ‰"],
    correct: 2
  },
  {
    q: "What blood alcohol level applies to young drivers (on probation or under 21)?",
    options: ["0.5 ‰", "0.3 ‰", "0.2 ‰", "0.0 ‰"],
    correct: 3
  },
  {
    q: "In the absence of a sign, the \"priority to the right\" rule (rechts vor links) means that:",
    options: [
      "The fastest vehicle goes first",
      "The vehicle coming from the right has priority",
      "The biggest vehicle has priority",
      "The first vehicle to arrive at the intersection goes first"
    ],
    correct: 1
  },
  {
    q: "On a motorway, which rule of thumb estimates the minimum safe following distance?",
    options: [
      "Half your speed, expressed in meters",
      "A fixed distance of 5 meters",
      "The duration of a red light",
      "Two vehicle lengths, regardless of speed"
    ],
    correct: 0
  },
  {
    q: "At an intersection, a flashing amber light means:",
    options: [
      "Mandatory stop for everyone",
      "Caution: the priority-to-the-right rule applies",
      "The light is out of service, no passing allowed",
      "Priority only for pedestrians"
    ],
    correct: 1
  },
  {
    q: "In Germany, at what age can you start accompanied driving (Begleitetes Fahren)?",
    options: ["15", "16", "17", "18"],
    correct: 2
  },
  {
    q: "Wearing a seatbelt is mandatory for:",
    options: [
      "The driver only",
      "Front-seat passengers only",
      "All occupants of the vehicle",
      "Only outside built-up areas"
    ],
    correct: 2
  }
];

const BONUS_QUESTIONS = [
  {
    q: "Is wearing a seatbelt mandatory for rear-seat passengers?",
    options: ["Yes", "No"],
    correct: 0
  },
  {
    q: "Can you use your phone while driving without a hands-free kit?",
    options: ["Yes", "No"],
    correct: 1
  },
  {
    q: "Is using a turn signal mandatory when changing lanes?",
    options: ["Yes", "No"],
    correct: 0
  },
  {
    q: "Can you overtake on the right on a motorway?",
    options: ["Yes", "No"],
    correct: 1
  }
];

let state = {
  mode: "start",   // start | main | bonus | lost | won
  round: 0,        // index into current question array
  total: 0,
  answered: false
};

const panel = document.getElementById("panel");
const ladder = document.getElementById("ladder");
const totalBadge = document.getElementById("totalBadge");

function renderTotal(){
  totalBadge.innerHTML = `<small>Prize Pool</small>€${state.total}`;
}

function renderLadder(){
  ladder.querySelectorAll(".rung").forEach(r => r.remove());
  if(state.mode === "bonus" || (state.mode==="won" && state.total>=10)){
    for(let i=1;i<=4;i++){
      const div = document.createElement("div");
      const done = i-1 < state.round || state.mode==="won";
      const current = (i-1 === state.round) && state.mode==="bonus";
      div.className = "rung bonus-mark" + (done?" done":"") + (current?" current":"");
      div.innerHTML = `<span class="n">Bonus ${i}</span><span>${current?"▶":done?"✓":"—"}</span>`;
      ladder.appendChild(div);
    }
    return;
  }
  for(let i=1;i<=10;i++){
    const div = document.createElement("div");
    const done = i <= state.total;
    const current = state.mode==="main" && i === state.round+1;
    div.className = "rung" + (done?" done":"") + (current?" current":"");
    div.innerHTML = `<span class="n">Q${i}</span><span>€${i}</span>`;
    ladder.appendChild(div);
  }
}

function renderStart(){
  state = {mode:"start", round:0, total:0, answered:false};
  panel.innerHTML = `
    <div class="screen">
      <div class="pill">German Traffic Code</div>
      <h1>Who Wants to Win a Million?</h1>
      <p>10 questions on the German traffic code (StVO), 4 possible answers each. Every correct answer adds <strong>€1</strong> to the prize pool. One mistake and it's over — but you'll get a chance to try again with 4 bonus questions with only 2 answer choices. Clear all 4 and you win!</p>
      <button class="btn" onclick="startMain()">Start the game</button>
    </div>
  `;
  renderTotal();
  renderLadder();
}

function startMain(){
  state = {mode:"main", round:0, total:0, answered:false};
  renderTotal();
  renderQuestion();
}

function startBonus(){
  state.mode = "bonus";
  state.round = 0;
  state.answered = false;
  renderQuestion();
}

function renderQuestion(){
  const list = state.mode === "main" ? MAIN_QUESTIONS : BONUS_QUESTIONS;
  const q = list[state.round];
  const total = list.length;
  const letters = ["A","B","C","D"];
  const twoOpt = q.options.length === 2;

  panel.innerHTML = `
    <div class="q-wrap">
      <div class="q-eyebrow">${state.mode === "main" ? "Question" : "Bonus"} ${state.round+1} / ${total}${state.mode==="main" ? " · worth €" + (state.round+1) : ""}</div>
      <div class="q-sign">${q.q}</div>
      <div class="options ${twoOpt ? "two" : ""}" id="optsWrap">
        ${q.options.map((opt,i) => `
          <button class="opt" data-i="${i}" onclick="answer(${i})">
            <span class="letter">${letters[i]}</span><span>${opt}</span>
          </button>
        `).join("")}
      </div>
      <div class="feedback" id="feedback"></div>
      <div class="footer-row" id="footerRow"></div>
    </div>
  `;
  renderLadder();
}

function answer(i){
  if(state.answered) return;
  state.answered = true;
  const list = state.mode === "main" ? MAIN_QUESTIONS : BONUS_QUESTIONS;
  const q = list[state.round];
  const buttons = document.querySelectorAll("#optsWrap .opt");
  buttons.forEach(b => b.disabled = true);
  buttons[q.correct].classList.add("correct");

  const feedback = document.getElementById("feedback");
  const footer = document.getElementById("footerRow");

  if(i === q.correct){
    if(state.mode === "main") state.total += 1;
    feedback.innerHTML = state.mode === "main"
      ? `Correct! Prize pool: €${state.total}.`
      : `Correct! Bonus ${state.round+1}/4 cleared.`;
    renderTotal();
    footer.innerHTML = `<button class="btn" onclick="next()">${nextLabel()}</button>`;
  } else {
    buttons[i].classList.add("wrong");
    if(state.mode === "main"){
      feedback.innerHTML = `Wrong answer. The game ends here — final prize pool: €${state.total}.`;
      footer.innerHTML = `<button class="btn" onclick="renderLost()">Continue</button>`;
    } else {
      feedback.innerHTML = `Wrong answer in the bonus round. Same rule applies: you need to restart the bonus round from the beginning.`;
      footer.innerHTML = `<button class="btn" onclick="startBonus()">Retry the bonus round</button>`;
    }
  }
  renderLadder();
}

function nextLabel(){
  const list = state.mode === "main" ? MAIN_QUESTIONS : BONUS_QUESTIONS;
  const isLast = state.round + 1 >= list.length;
  if(state.mode === "main") return isLast ? "See the final result" : "Next question";
  return isLast ? "See the win" : "Next bonus";
}

function next(){
  const list = state.mode === "main" ? MAIN_QUESTIONS : BONUS_QUESTIONS;
  state.round += 1;
  state.answered = false;
  if(state.round >= list.length){
    if(state.mode === "main"){
      renderWon(true);
    } else {
      renderWon(false);
    }
    return;
  }
  renderQuestion();
}

function renderLost(){
  state.mode = "lost";
  panel.innerHTML = `
    <div class="screen">
      <div class="pill">Game over</div>
      <div class="badge-euro">€${state.total}</div>
      <p>That's the prize pool you take home from the main questions. You can try your luck again right away with a bonus round: 4 questions, only 2 possible answers each time. Clear all 4 without a mistake and it's a guaranteed win.</p>
      <button class="btn" onclick="startBonus()">Try the bonus round</button>
      <button class="btn secondary" onclick="renderStart()">Start over</button>
    </div>
  `;
  renderLadder();
}

function renderWon(fromMain){
  state.mode = "won";
  panel.innerHTML = `
    <div class="screen">
      <div class="pill">${fromMain ? "10/10 questions" : "Bonus round completed"}</div>
      <h1>Congratulations, you won! 🏁</h1>
      <div class="badge-euro">${fromMain ? "€" + state.total : "Victory"}</div>
      <p>${fromMain
        ? "You answered all 10 German traffic code questions correctly and won the entire prize pool."
        : "You cleared the 4 bonus questions without a mistake — the game is won, even though the main prize pool stays at €" + state.total + "."}</p>
      <button class="btn" onclick="renderStart()">Play again</button>
    </div>
  `;
  renderLadder();
}

renderStart();
</script>
</body>
</html>
